name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt-Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Abhängigkeiten
        run: python -m pip install -r requirements.txt pytest
      - name: OCR-Sprachdaten laden (prüft setup_ki)
        run: python -m blackline2.setup_ki --nur-ocr
      - name: Download-Quellen prüfen
        run: python -m blackline2.setup_ki --quellen-pruefen
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v

  ki-integration:
    name: Echte lokale KI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: python -m pip install -r requirements.txt pytest
      - name: Modell-Cache
        uses: actions/cache@v4
        with:
          path: ki/modelle
          key: ki-modell-schnell-v1
      - name: KI + OCR einrichten (llama.cpp, Modell "schnell")
        run: python -m blackline2.setup_ki --modell schnell
      - name: Selbsttest der KI
        run: python -m blackline2.setup_ki --test
      - name: Ende-zu-Ende mit echter KI (Scan -> OCR -> KI -> Schwärzung -> Prüfung)
        env:
          BLACKLINE_REAL_KI: "1"
        run: python -m pytest -v -s tests/test_real_ki.py
