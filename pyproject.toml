[project]
name = "blackline2"
version = "0.1.0"
description = "KI-gestützte Schwärzung von Dokumenten für die Anwaltspraxis – vollständig lokal"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "PyMuPDF>=1.24.10",
    "Pillow>=10.1",
    "numpy>=1.26",
    "rapidfuzz>=3.0",
    "psutil>=5.9",
    "python-docx>=1.1",
    "pywin32>=306; sys_platform == 'win32'",
    "certifi",
]

[project.scripts]
blackline2 = "blackline2.gui.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
